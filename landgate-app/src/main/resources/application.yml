spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:test}
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true
  mail:
    host: ${SMTP_HOST:}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

mybatis:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.landgate.infrastructure.dao.po
  configuration:
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

landgate:
  jwt:
    access-token-expire-seconds: 3600
    refresh-token-expire-seconds: 604800
  security:
    credential-encryption-key: ${CREDENTIAL_ENCRYPTION_KEY:}
  gateway:
    max-body-size: ${GATEWAY_MAX_BODY_SIZE:67108864}
  verification:
    email-code-expire-seconds: 300
    email-resend-cooldown-seconds: 60
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
  ratelimit:
    registration:
      max-per-ip-per-hour: ${REGISTER_RATE_LIMIT:3}

server:
  shutdown: graceful
