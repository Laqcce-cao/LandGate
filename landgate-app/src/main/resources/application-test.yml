server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:13306}/${DB_NAME:sub2api}?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      idle-timeout: 300000
      connection-timeout: 10000
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:127.0.0.1}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123321}
      lettuce:
        pool:
          max-active: 10
          max-idle: 5
          min-idle: 2

landgate:
  jwt:
    signing-key: ${JWT_SIGNING_KEY:12345678901234567890123456789012}
  verification:
    email-code-expire-seconds: 300
    email-resend-cooldown-seconds: 60
  captcha:
    enabled: ${CAPTCHA_ENABLED:false}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
  ratelimit:
    registration:
      max-per-ip-per-hour: ${REGISTER_RATE_LIMIT:100}

redis:
  sdk:
    config:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:123321}
      pool-size: 10
      min-idle-size: 5

logging:
  level:
    com.landgate: DEBUG
    org.springframework.web: INFO
