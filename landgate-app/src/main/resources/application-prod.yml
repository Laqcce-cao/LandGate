server:
  port: ${SERVER_PORT:8080}

spring:
  datasource:
    url: jdbc:mysql://${DB_HOST}:${DB_PORT:3306}/${DB_NAME:sub2api}?useSSL=true&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=utf8
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 10
      idle-timeout: 300000
      connection-timeout: 10000
      connection-init-sql: "SET time_zone = '+08:00'"
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST}
    port: ${SMTP_PORT:587}
    username: ${SMTP_USERNAME}
    password: ${SMTP_PASSWORD}
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      lettuce:
        pool:
          max-active: 50
          max-idle: 20
          min-idle: 10

landgate:
  jwt:
    signing-key: ${JWT_SIGNING_KEY}
  verification:
    email-code-expire-seconds: 300
    email-resend-cooldown-seconds: 60
  captcha:
    enabled: ${CAPTCHA_ENABLED:true}
    turnstile-secret-key: ${TURNSTILE_SECRET_KEY:}
  ratelimit:
    registration:
      max-per-ip-per-hour: ${REGISTER_RATE_LIMIT:3}

redis:
  sdk:
    config:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD}
      pool-size: 10
      min-idle-size: 5

logging:
  level:
    com.landgate: INFO
    org.springframework.web: WARN
